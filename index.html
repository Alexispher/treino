<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Treino - GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #2da44e; color: white; } /* Cor verde estilo GitHub */
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn-reset { margin-top: 20px; padding: 10px 15px; background-color: #d9383a; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Painel de Treinos do Atleta (Simulação de Banco)</h1>

    <table id="tabelaTreinos">
        <thead>
            <tr>
                <th>Atleta</th>
                <th>Data do Treino</th>
                <th>Exercício</th>
                <th>Carga (kg)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <button class="btn-reset" onclick="reiniciarBanco()">Resetar/Inserir Dados Iniciais</button>

    <script>
        // Paradigma de Orientação a Dados: Simulando as Tabelas do seu SQL
        const tabelasIniciais = {
            Atleta: [
                { id: 1, nome: 'Jogador Solo', peso_kg: 71.00, altura_m: 1.86 }
            ],
            Treino: [
                { id: 1, id_atleta: 1, data_treino: '2026-04-14', foco_principal: 'Membros Inferiores' }
            ],
            Exercicio: [
                { id: 1, id_treino: 1, nome_exercicio: 'Leg Press 45', series: 1, repeticoes: 8, carga_kg: 200.00 },
                { id: 2, id_treino: 1, nome_exercicio: 'Cadeira Extensora', series: 1, repeticoes: 10, carga_kg: 80.00 }
            ]
        };

        // Se o "banco" não existir no navegador, cria com os dados que você mandou
        if (!localStorage.getItem('SistemaTreino')) {
            localStorage.setItem('SistemaTreino', JSON.stringify(tabelasIniciais));
        }

        // Função que simula o seu comando SELECT com JOIN
        function carregarDadosComJoin() {
            const banco = JSON.parse(localStorage.getItem('SistemaTreino'));
            const tbody = document.querySelector('#tabelaTreinos tbody');
            tbody.innerHTML = ''; // Limpa a tabela

            // Executando a lógica do seu JOIN manualmente:
            // Atleta JOIN Treino ON Atleta.id = Treino.id_atleta
            // JOIN Exercicio ON Treino.id = Exercicio.id_treino
            banco.Exercicio.forEach(exercicio => {
                const treino = banco.Treino.find(t => t.id === exercicio.id_treino);
                const atleta = banco.Atleta.find(a => a.id === treino.id_atleta);

                if (atleta && treino) {
                    // Formata a data para o padrão brasileiro
                    const data Formatada = treino.data_treino.split('-').reverse().join('/');

                    // Cria a linha na tabela HTML
                    const linha = `
                        <tr>
                            <td>${atleta.nome}</td>
                            <td>${dataFormatada}</td>
                            <td>${exercicio.nome_exercicio}</td>
                            <td>${exercicio.carga_kg} kg</td>
                        </tr>
                    `;
                    tbody.innerHTML += linha;
                }
            });
        }

        // Função auxiliar caso queira resetar o banco do navegador pro estado inicial
        function reiniciarBanco() {
            localStorage.setItem('SistemaTreino', JSON.stringify(tabelasIniciais));
            carregarDadosComJoin();
            alert('Banco de dados resetado com os dados do seu exercício!');
        }

        // Executa o "JOIN" assim que a página carrega
        window.onload = carregarDadosComJoin;
    </script>
</body>
</html>
