<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetLog - Diário de Treino Pessoal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gb-red: #7A0000;
            --gb-red-hover: #990000;
            --gb-dark: #1A1A1A;
            --gb-light: #F4F4F6;
            --text-dark: #222222;
            --border-color: #e1e1e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--gb-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background-color: var(--gb-dark);
            color: white;
            padding: 20px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--gb-red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-area span {
            color: var(--gb-red);
        }

        .badge-unidade {
            background-color: var(--gb-red);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Formulários e Inputs */
        .card-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            flex-grow: 1;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: var(--gb-red);
        }

        button {
            background-color: var(--gb-dark);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
        }

        button:hover {
            background-color: var(--gb-red);
        }

        .btn-danger {
            background-color: #ffebe6;
            color: var(--gb-red);
            padding: 8px 12px;
        }
        
        .btn-danger:hover {
            background-color: var(--gb-red);
            color: white;
        }

        .btn-edit {
            background-color: #e6f0ff;
            color: #0044cc;
            padding: 8px 12px;
        }

        .btn-edit:hover {
            background-color: #0044cc;
            color: white;
        }

        /* Lista de Fichas */
        .ficha-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            overflow: hidden;
        }

        .ficha-header {
            background-color: var(--gb-dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ficha-header h3 {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ficha-acoes {
            display: flex;
            gap: 10px;
        }

        .ficha-body {
            padding: 20px;
        }

        /* Tabela de Exercícios Interna */
        .add-exercicio-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--gb-light);
            padding: 15px;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .add-exercicio-form input {
            flex: 1;
            min-width: 100px;
        }

        .add-exercicio-form input.num-input {
            flex: 0 0 90px;
        }

        .exercicios-lista {
            list-style: none;
        }

        .exercicios-lista li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .exercicios-lista li:last-child {
            border-bottom: none;
        }

        .ex-nome {
            font-weight: 600;
            color: var(--gb-dark);
            flex: 1.5;
        }

        .ex-detalhes {
            display: flex;
            gap: 10px;
            flex: 2;
            justify-content: flex-end;
            align-items: center;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            margin-right: 15px;
        }

        .ex-badge {
            background-color: #f0f0f5;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #e1e1e6;
            white-space: nowrap;
        }

        .carga-destaque {
            background-color: #ffebe6;
            color: var(--gb-red);
            font-weight: 700;
            border-color: #ffd1c7;
        }

        @media screen and (max-width: 768px) {
            .exercicios-lista li {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .ex-detalhes {
                justify-content: flex-start;
                width: 100%;
                flex-wrap: wrap;
            }
            .btn-danger {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>SET<span>LOG</span></h1>
        </div>
        <div class="badge-unidade">Minhas Fichas</div>
    </header>

    <main>
        <div class="card-form">
            <input type="text" id="novaFichaNome" placeholder="Ex: Ficha A - Peito e Tríceps" autocomplete="off">
            <button onclick="adicionarFicha()">+ Criar Nova Ficha</button>
        </div>

        <div id="containerFichas"></div>
    </main>

    <script>
        let fichas = JSON.parse(localStorage.getItem('setlog_fichas')) || [];

        function salvarDados() {
            localStorage.setItem('setlog_fichas', JSON.stringify(fichas));
            renderizarFichas();
        }

        function adicionarFicha() {
            const inputNome = document.getElementById('novaFichaNome');
            const nome = inputNome.value.trim();
            
            if (nome === '') {
                alert('Digite um nome para a ficha!');
                return;
            }

            const novaFicha = {
                id: Date.now(),
                nome: nome,
                exercicios: []
            };

            fichas.push(novaFicha);
            inputNome.value = '';
            salvarDados();
        }

        function deletarFicha(id) {
            if(confirm('Tem certeza que deseja excluir esta ficha inteira?')) {
                fichas = fichas.filter(ficha => ficha.id !== id);
                salvarDados();
            }
        }

        function editarFicha(id) {
            const ficha = fichas.find(f => f.id === id);
            const novoNome = prompt('Digite o novo nome da ficha:', ficha.nome);
            
            if (novoNome !== null && novoNome.trim() !== '') {
                ficha.nome = novoNome.trim();
                salvarDados();
            }
        }

        function adicionarExercicio(fichaId) {
            const nomeInput = document.getElementById(`exNome_${fichaId}`);
            const seriesInput = document.getElementById(`exSeries_${fichaId}`);
            const repsInput = document.getElementById(`exReps_${fichaId}`);
            const cargaInput = document.getElementById(`exCarga_${fichaId}`);

            const nome = nomeInput.value.trim();
            const series = seriesInput.value;
            const reps = repsInput.value;
            const carga = cargaInput.value;

            // Validação agora exige a carga
            if (nome === '' || series === '' || reps === '' || carga === '') {
                alert('Preencha todos os campos do exercício, incluindo a carga!');
                return;
            }

            const fichaIndex = fichas.findIndex(f => f.id === fichaId);
            
            fichas[fichaIndex].exercicios.push({
                idExercicio: Date.now(),
                nome: nome,
                series: series,
                reps: reps,
                carga: carga // Salvando a carga no objeto
            });

            salvarDados();
        }

        function deletarExercicio(fichaId, idExercicio) {
            const fichaIndex = fichas.findIndex(f => f.id === fichaId);
            fichas[fichaIndex].exercicios = fichas[fichaIndex].exercicios.filter(ex => ex.idExercicio !== idExercicio);
            salvarDados();
        }

        function renderizarFichas() {
            const container = document.getElementById('containerFichas');
            container.innerHTML = '';

            if (fichas.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: #888; padding: 40px; background: white; border-radius: 12px;">
                        <h3>Nenhuma ficha cadastrada</h3>
                        <p>Comece criando sua primeira ficha de treino acima!</p>
                    </div>
                `;
                return;
            }

            fichas.forEach(ficha => {
                let listaExerciciosHTML = '';
                if (ficha.exercicios.length === 0) {
                    listaExerciciosHTML = `<p style="text-align: center; color: #888; font-size: 14px; margin: 15px 0;">Nenhum exercício adicionado ainda.</p>`;
                } else {
                    ficha.exercicios.forEach(ex => {
                        listaExerciciosHTML += `
                            <li>
                                <div class="ex-nome">🏋️‍♂️ ${ex.nome}</div>
                                <div class="ex-detalhes">
                                    <span class="ex-badge">${ex.series} Séries</span>
                                    <span class="ex-badge">${ex.reps} Reps</span>
                                    <span class="ex-badge carga-destaque">${ex.carga} kg</span>
                                </div>
                                <button class="btn-danger" onclick="deletarExercicio(${ficha.id}, ${ex.idExercicio})">Excluir</button>
                            </li>
                        `;
                    });
                }

                const cardFicha = `
                    <div class="ficha-card">
                        <div class="ficha-header">
                            <h3>📋 ${ficha.nome}</h3>
                            <div class="ficha-acoes">
                                <button class="btn-edit" onclick="editarFicha(${ficha.id})">✏️ Renomear</button>
                                <button class="btn-danger" onclick="deletarFicha(${ficha.id})">🗑️ Excluir Ficha</button>
                            </div>
                        </div>
                        <div class="ficha-body">
                            <div class="add-exercicio-form">
                                <input type="text" id="exNome_${ficha.id}" placeholder="Exercício (Ex: Supino)">
                                <input type="number" id="exSeries_${ficha.id}" class="num-input" placeholder="Séries" min="1">
                                <input type="number" id="exReps_${ficha.id}" class="num-input" placeholder="Reps" min="1">
                                <input type="number" id="exCarga_${ficha.id}" class="num-input" placeholder="Carga (kg)" min="0" step="0.5">
                                <button onclick="adicionarExercicio(${ficha.id})">+ Add</button>
                            </div>

                            <ul class="exercicios-lista">
                                ${listaExerciciosHTML}
                            </ul>
                        </div>
                    </div>
                `;
                container.innerHTML += cardFicha;
            });
        }

        renderizarFichas();
    </script>
</body>
</html>
